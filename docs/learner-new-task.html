<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Hub - New Task</title>
  <link rel="stylesheet" href="learner-new-task style.css">
</head>
<body>

  <!-- 1. LEFT SIDEBAR NAVIGATION -->
  <div class="sidebar" id="sidebar">
    <div class="brand">
      Learning Hub
    </div>

    <ul class="nav-menu">
      <li class="nav-item" onclick="switchView('Dashboard', this)">Dashboard</li>
      <li class="nav-item active" onclick="goToTasks()">My Tasks</li>
      <li class="nav-item" onclick="switchView('Support Booking', this)">Support Booking</li>
      <li class="nav-item" onclick="switchView('Resources', this)">Resources</li>
      <li class="nav-item" onclick="switchView('Progress', this)">Progress</li>
      <li class="nav-item" onclick="switchView('Mini Game', this)">Mini Game</li>
      <li class="nav-item" onclick="switchView('Settings', this)">Settings</li>
    </ul>

    <div class="user-profile">
      <div class="profile-info">
        <div class="avatar">S</div>
        <div>
          <div class="welcome-text">Welcome back,</div>
          <div class="user-name">Sindile</div>
          <div class="user-role">Learner</div>
        </div>
      </div>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>
  </div>

  <!-- 2. MAIN APPLICATION CONTENT -->
  <div class="main-wrapper">

    <!-- TOP NAVIGATION HEADER -->
    <div class="top-header">
      <button class="menu-toggle-btn" onclick="toggleSidebar()">≡</button>
      <div class="header-right">
        <span class="date-text">Wed, 10 Oct 2026</span>
        <div class="header-user">
          <div class="avatar-small">S</div>
          <span>Sindile</span>
        </div>
      </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="content-container">

      <!-- FORM CARD CONTAINER -->
      <div class="form-card">

        <!-- HEADER WITH BACK ARROW & TITLE -->
        <div class="card-header">
          <button class="back-btn" onclick="goToTasks()" title="Go back to My Tasks">←</button>
          <div>
            <h1 class="page-title">New Task</h1>
            <p class="page-subtitle">Add a new task to your list and keep track of your progress.</p>
          </div>
        </div>

        <!-- NEW TASK INPUT FORM -->
        <form id="newTaskForm" onsubmit="saveNewTask(event)">

          <!-- 1. Task Title Field -->
          <div class="form-group">
            <label class="form-label" for="taskTitle">Task Title <span class="required">*</span></label>
            <input type="text" id="taskTitle" class="form-control" placeholder="Enter task title..." required>
          </div>

          <!-- 2. Description Field -->
          <div class="form-group">
            <label class="form-label" for="taskDescription">Description</label>
            <textarea id="taskDescription" class="form-control textarea" placeholder="Add a description..."></textarea>
          </div>

          <!-- 3. Due Date Input -->
          <div class="form-group">
            <label class="form-label" for="taskDueDate">Due Date</label>
            <input type="date" id="taskDueDate" class="form-control">
          </div>

          <!-- 4. Status Dropdown -->
          <div class="form-group">
            <label class="form-label" for="taskStatus">Status</label>
            <select id="taskStatus" class="form-control select-control">
              <option value="Pending">Pending</option>
              <option value="In Progress">In Progress</option>
              <option value="Complete">Complete</option>
            </select>
          </div>

          <!-- 5. Priority Radio Options -->
          <div class="form-group">
            <label class="form-label">Priority</label>
            <div class="priority-options">

              <label class="priority-card">
                <input type="radio" name="priority" value="Low"> Low
              </label>

              <label class="priority-card">
                <input type="radio" name="priority" value="Medium" checked> Medium
              </label>

              <label class="priority-card">
                <input type="radio" name="priority" value="High"> High
              </label>

            </div>
          </div>

          <!-- FORM ACTION BUTTONS -->
          <div class="button-row">
            <button type="submit" class="btn btn-create">+ Create New Task</button>
            <button type="button" class="btn btn-clear" onclick="clearForm()">Clear Form</button>
          </div>

        </form>

      </div>

    </div>

  </div>

  <script src="learner-new-task script.js"></script>
</body>
</html>
