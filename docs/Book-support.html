<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Support Session</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- CARD WRAPPER -->
  <div class="card-wrapper">
    <h1 class="card-title">Book Support Session</h1>

    <!-- FORM BOX -->
    <div class="form-container">

      <!-- 1. Topic dropdown selection -->
      <label class="form-label" for="topicSelect">What do you need help with?</label>
      <select id="topicSelect" class="form-control">
        <option value="JavaScript">JavaScript</option>
        <option value="HTML">HTML</option>
        <option value="CSS">CSS</option>
        <option value="Git & GitHub">Git & GitHub</option>
      </select>

      <!-- 2. Problem description text area -->
      <label class="form-label" for="problemDescription">Describe your problem</label>
      <textarea id="problemDescription" class="form-control" placeholder="Write details here..."></textarea>

      <!-- 3. Date input -->
      <label class="form-label" for="sessionDate">Choose Date</label>
      <input type="date" id="sessionDate" class="form-control">

      <!-- 4. Time selection dropdown (Populated dynamically via JavaScript) -->
      <label class="form-label" for="sessionTime">Choose Time</label>
      <select id="sessionTime" class="form-control">
        <!-- Options generated by script.js -->
      </select>

    </div>

    <!-- BUTTONS -->
    <div class="button-group">
      <button type="button" class="btn btn-cancel" onclick="clearForm()">Cancel</button>
      <button type="button" class="btn btn-submit" onclick="bookSession()">Book Session</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
