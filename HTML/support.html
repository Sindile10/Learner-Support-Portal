<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learning Hub - Support</title>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="../CSS/support.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="top">
      <div class="logo">
        <span>LEARNING HUB</span>
      </div>
      <i class="bx bx-menu" id="btn"></i>
    </div>

    <ul>
      <li><a href="learner-dashboard.html"><i class="bx bxs-grid-alt"></i><span>Dashboard</span></a></li>
      <li><a href="task.html"><i class="bx bx-task"></i><span>Task</span></a></li>
      <li class="active"><a href="support.html"><i class="bx bx-user-voice"></i><span>Support</span></a></li>
      <li><a href="progress.html"><i class="bx bx-bar-chart-alt-2"></i><span>Progress</span></a></li>
      <li><a href="mini-game.html"><i class="bx bx-paper-plane"></i><span>Mini-Game</span></a></li>
      <li><a href="summary.html"><i class="bx bx-home-alt"></i><span>Summary</span></a></li>
      <li><a href="settings.html"><i class="bx bx-cog"></i><span>Settings</span></a></li>
    </ul>
  </aside>

  <div class="dashboard-wrapper">
    <header class="top-nav">
      <button class="notification-btn" title="Notifications" aria-label="Notifications">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2F80ED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <div class="notification-dot"></div>
      </button>
    </header>

    <main class="main-panel">
      <section class="welcome-header">
        <h1>Support &amp; Assessor Messages</h1>
        <p>Choose a topic, send a message to your assessor, and book a time that works for you.</p>
      </section>

      <div class="card form-card">
        <label class="form-label" for="topicSelect">What do you need help with?</label>
        <select id="topicSelect" class="form-control">
          <option value="JavaScript">JavaScript</option>
          <option value="HTML">HTML</option>
          <option value="CSS">CSS</option>
          <option value="Git &amp; GitHub">Git &amp; GitHub</option>
        </select>

        <label class="form-label" for="problemDescription">Describe your problem</label>
        <textarea id="problemDescription" class="form-control" placeholder="Write details here..."></textarea>

        <label class="form-label" for="assessorMessage">Message to assessor</label>
        <textarea id="assessorMessage" class="form-control" placeholder="Send a quick message to your assessor..."></textarea>

        <label class="form-label" for="sessionDate">Choose Date</label>
        <input type="date" id="sessionDate" class="form-control" />

        <label class="form-label" for="sessionTime">Choose Time</label>
        <select id="sessionTime" class="form-control"></select>

        <div id="supportMessageStatus" class="message-status" aria-live="polite"></div>
      </div>

      <div class="button-group">
        <button type="button" class="btn btn-secondary" onclick="clearForm()">Clear</button>
        <button type="button" class="btn btn-primary" onclick="sendMessageToAssessor()">Send Message</button>
        <button type="button" class="btn btn-primary" onclick="bookSession()">Book Session</button>
      </div>

      <div class="card form-card">
        <h2>Recent Assessor Messages</h2>
        <div id="assessorMessagesList" class="messages-list"></div>
      </div>
    </main>
  </div>

  <script src="../JAVASCRIPT/theme.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-database-compat.js"></script>
  <script src="../JAVASCRIPT/support.js"></script>
</body>
</html>
