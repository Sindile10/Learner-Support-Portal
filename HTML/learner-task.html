<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Hub - Learner Tasks</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/dashboard 1.css">
    <link rel="stylesheet" href="../CSS/learner-task.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="top">
            <div class="logo"><span>LEARNING HUB</span></div>
            <i class="bx bx-menu" id="btn" aria-label="Toggle navigation"></i>
        </div>
        <ul>
            <li><a href="assessor-dashboard.html"><i class="bx bxs-grid-alt"></i><span>Dashboard</span></a></li>
            <li><a href="support-bookings.html"><i class="bx bx-user-voice"></i><span>Support Bookings</span></a></li>
            <li class="active"><a href="learner-task.html"><i class="bx bx-notepad"></i><span>Learner Tasks</span></a></li>
            <li><a href="settings.html"><i class="bx bx-cog"></i><span>Settings</span></a></li>
        </ul>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="left-top"><span class="logo-mark">🎓</span><h3>Learning Hub</h3></div>
            <div class="right-top">
                <button id="notifBtn" class="notif"><i class="bx bx-bell"></i> <span id="notifCount" class="count">3</span> Notifications</button>
                <div class="user-top" id="userTop"><i class="bx bx-user-circle"></i> <span id="topName">JOHN</span> <i class="bx bx-chevron-down"></i></div>
            </div>
        </header>

        <section class="content">
            <div class="welcome">
                <div class="welcome-icon"><i class="bx bx-user"></i></div>
                <div>
                    <p>Welcome back</p>
                    <h1>Learner Activities</h1>
                </div>
            </div>

            <div class="table-panel">
                <div class="filters">
                    <div class="search-box">
                        <i class="bx bx-search"></i>
                        <input type="text" id="search" placeholder="Search learner...">
                    </div>
                    <div class="date-box">
                        <i class="bx bx-calendar"></i>
                        <select id="dateRange">
                            <option value="All">Select date range</option>
                            <option value="today">Today</option>
                            <option value="week">This Week</option>
                            <option value="month">This Month</option>
                        </select>
                    </div>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>DATE ↕</th>
                                <th>LEARNER ↕</th>
                                <th>ACTIVITY ↕</th>
                                <th>STATUS ↕</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>

                    <div class="bottom">
                        <p id="showText">Showing 1 - 3 of 3</p>
                        <div class="pages">
                            <button id="prev"> < </button>
                            <button class="active">1</button>
                            <button id="next"> > </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <p id="msg" class="status-copy"></p>

    <div id="actionPopup" class="popup hidden">
        <div class="popup-box">
            <h3 id="popupLearner">SINDILE</h3>
            <p id="popupDate"></p>
            <hr>
            <button id="btnComplete" class="btn">Mark Complete</button>
            <button id="btnDelete" class="btn red">Delete Activity</button>
            <button id="btnClose" class="btn gray">Close</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-database-compat.js"></script>
    <script src="../JAVASCRIPT/learner-task.js"></script>
    <script>
        const sidebarToggle = document.getElementById('btn');
        const sidebar = document.getElementById('sidebar');
        if (sidebarToggle && sidebar) {
            sidebarToggle.addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
            });
        }
    </script>
</body>
</html>
