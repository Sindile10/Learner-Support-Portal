<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Hub - Create Account</title>
    <link rel="stylesheet" href="../CSS/create-account.css">
</head>
<body>
    <div class="login-box">
        <form id="authForm" action="">
            <h1>Learning Hub</h1>
            <h2>Create Account</h2>

            <div class="input-box">
                <span class="icon"><ion-icon name="person"></ion-icon></span>
                <input type="text" id="username" required>
                <label>Username</label>
            </div>
            <span class="error-msg" id="usernameError"></span>

            <div class="input-box">
                <span class="icon"><ion-icon name="mail"></ion-icon></span>
                <input type="email" id="email" required>
                <label>Email</label>
            </div>
            <span class="error-msg" id="emailError"></span>

            <div class="input-box">
                <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
                <input type="password" id="password" required>
                <label>Password</label>           
            </div>
            <span class="error-msg" id="passError"></span>

            <div class="select-role">
                <select id="role" required>
                    <option value="">Select role</option>
                    <option value="learner">Learner</option>
                    <option value="assessor">Assessor</option>
                </select>
            </div>
            <span class="error-msg" id="roleError"></span>

            <button type="submit" id="submitBtn">Create Account</button>
            
            <div class="register-link">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </div>
        </form>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script type="module" src="../JAVASCRIPT/create-account.js"></script>
</body>
</html>
