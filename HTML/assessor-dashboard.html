<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Hub - Assessor</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/assessor-dashboard.css">
</head>
<body>
<aside class="sidebar" id="sidebar">
    <div class="top">
        <div class="logo"><span>LEARNING HUB</span></div>
        <i class="bx bx-menu" id="btn" aria-label="Toggle navigation"></i>
    </div>
    <ul>
        <li class="active"><a href="assessor-dashboard.html"><i class="bx bxs-grid-alt"></i><span>Dashboard</span></a></li>
        <li><a href="support-bookings.html"><i class="bx bx-user-voice"></i><span>Support Bookings</span></a></li>
        <li><a href="assessor-settings.html"><i class="bx bx-cog"></i><span>Settings</span></a></li>
    </ul>
</aside>

<main class="main-content">
    <header class="topbar">
        <div class="left-top"><span class="logo-mark">🎓</span><h3>Learning Hub</h3></div>
        <div class="right-top">
            <button id="notifBtn" class="notif"><i class="bx bx-bell"></i> <span id="count" class="count">3</span> Notifications</button>
            <div class="user-top" id="userTop"><i class="bx bx-user-circle"></i> <span id="userNameTop">USER</span> <i class="bx bx-chevron-down"></i></div>
        </div>
    </header>
    <section class="content">
        <div class="welcome">
            <div class="welcome-icon"><i class="bx bx-user"></i></div>
            <div><p>Welcome back</p><h1 id="welcomeName">User</h1></div>
        </div>
        <div class="card" id="goSupport">
            <div class="card-icon"><i class="bx bx-book-open"></i></div>
            <h2>Support Booking</h2><span class="arrow">&gt;</span>
        </div>
        <div class="card" id="goTask">
            <div class="card-icon blue"><i class="bx bx-notepad"></i></div>
            <h2>Learner Task</h2><span class="arrow">&gt;</span>
        </div>

        <div class="card">
            <h2>Incoming Booking Requests</h2>
            <div id="assessorInbox" class="message-list">
                <p class="empty-state">Waiting for new booking requests...</p>
            </div>
        </div>

        <p id="status"></p>
    </section>
</main>

<div id="notifPopup" class="popup hidden">
    <div class="popup-box">
        <h3>Notifications</h3>
        <div id="notifList" class="notif-list"></div>
        <button id="closeNotif" class="close-btn">Close</button>
    </div>
</div>
<script src="../JAVASCRIPT/theme.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-database-compat.js"></script>
<script src="../JAVASCRIPT/assessor-dashboard.js"></script>
<script src="../JAVASCRIPT/dashboard 1.js"></script>
<script>
    document.getElementById('btn').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('collapsed');
    });
</script>
</body>
</html>
