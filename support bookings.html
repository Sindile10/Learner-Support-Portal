<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Hub - Support Bookings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- TOP HEADER BAR -->
  <header class="top-header">
    <div class="header-left">
      <span class="brand-title">Learning Hub</span>
    </div>
    <div class="header-right">
      <span class="nav-badge">Notifications (3)</span>
      <span class="user-profile">JOHN</span>
    </div>
  </header>

  <!-- APP CONTAINER -->
  <div class="app-wrapper">

    <!-- FUNCTIONAL SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-toggle-btn active" onclick="toggleSidebar()">
        Side Bar
      </button>

      <ul class="sidebar-menu">
        <li class="menu-item" onclick="switchView('DashBoard', this)">DashBoard</li>
        <li class="menu-item active" onclick="switchView('Support Booking', this)">Support Booking</li>
        <li class="menu-item" onclick="switchView('Learner Task', this)">Learner Task</li>
        <li class="menu-item" onclick="switchView('Settings', this)">Settings</li>
      </ul>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="main-content">

      <!-- PAGE TITLE -->
      <h1 class="page-title">Support Bookings</h1>

      <!-- BOOKINGS GRID LAYOUT -->
      <div class="bookings-grid">

        <!-- LEFT COLUMN: BOOKING DETAILS -->
        <div class="left-column">

          <!-- MAIN DETAILS CARD -->
          <div class="card details-card">
            <div class="details-row">
              <div class="details-group">
                <span class="label">Request</span>
                <span class="value">LEARNER</span>
              </div>
              <div class="details-group">
                <span class="label">Type</span>
                <span class="value">SINDILE</span>
              </div>
            </div>

            <div class="details-divider"></div>

            <div class="details-group">
              <span class="label">Topic</span>
              <span class="value">JAVASCRIPT</span>
            </div>

            <div class="details-divider"></div>

            <div class="details-group">
              <span class="label">Date</span>
              <span class="value">20 AUG 2026</span>
            </div>
          </div>

          <!-- NOTES CARD -->
          <div class="card notes-card">
            <span class="label">Notes</span>
            <p class="notes-text">I need help with login function</p>
          </div>

        </div>

        <!-- RIGHT COLUMN: ACTION CARDS -->
        <div class="right-column">

          <!-- CURRENT STATUS CARD -->
          <div class="card status-card">
            <span class="label">Current Status</span>
            <div class="status-badge" id="currentStatusBadge">In Progress</div>
          </div>

          <!-- UPDATE STATUS CARD -->
          <div class="card action-card">
            <span class="label">Update Status</span>
            <select class="status-select" id="statusSelect" onchange="updateBookingStatus()">
              <option value="APPROVED" selected>APPROVED</option>
              <option value="PENDING">PENDING</option>
              <option value="REJECTED">REJECTED</option>
            </select>
          </div>

          <!-- CLOSE BOOKINGS CARD -->
          <div class="card action-card">
            <span class="label">Close Bookings</span>
            <button class="btn btn-close" onclick="closeBooking()">Close Booking</button>
          </div>

          <!-- VIEW LEARNER PROFILE CARD -->
          <div class="card action-card">
            <span class="label">View Learner Profile</span>
            <button class="btn btn-profile" onclick="viewLearnerProfile()">View Profile</button>
          </div>

        </div>

      </div>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
